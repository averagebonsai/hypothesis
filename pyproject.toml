[project]
name = "hypothesis"
version = "0.1.0"
description = "LLM-driven microeconomic simulator"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
author-check = "extension_worker.author_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulation_core", "src/components", "src/examples", "src/agent_tools", "src/extension_worker"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "nbclient",
    "ipykernel",
    "matplotlib",
    "mypy>=2.4.1",
    "scipy-stubs>=1.18.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["simulation_core", "components", "examples", "agent_tools", "extension_worker"]
known-third-party = ["experiment_extension"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
